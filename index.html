<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA 核心配置 -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA 支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="物品记录">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <!-- 主题色 + 图标 -->
  <meta name="theme-color" content="#4A90D9">
  <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">

  <title>物品位置记录</title>

  <!-- 立即跳转到 standalone.html，不保留历史记录 -->
  <script>
    // 使用 replace 跳转，这样不会在历史记录中留下 index.html
    // 加时间戳防止缓存
    var target = './standalone.html' + location.hash;
    location.replace(target);
  </script>

  <!-- 如果 JS 被禁用，用 meta refresh 兜底 -->
  <meta http-equiv="refresh" content="0; url=standalone.html">
</head>
<body>
  <p style="text-align:center;padding-top:40px;font-family:sans-serif;color:#8a8a8e;">正在加载...</p>
</body>
</html>
